<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../static/signup.css">

</head>

<body>
    <main>
        <header>
            <form>
                <div class="form-check">
                    <input id="student" class="check form-check-input" type="radio" value="Student" name="user">
                    <label class="form-check-label" for="student">Sign up as a Student</label>
                </div>

                <div class="form-check">
                    <input id="instructor" class="check form-check-input" type="radio" value="Instructor" name="user">
                    <label class="form-check-label" for="instructor">Sign up as a Instructor</label>
                </div>
            </form>
            <button class="btn btn-primary" id="reset">Reset Page</button>
        </header>

        <!-- student form -->

        <div id="stuForm">
            <h2>Register as a Student</h2>

            <form class="Form">

                <div>
                    <label class="form-label">First Name</label>
                    <input class="form-control" type="text" id="fname" name="fname" placeholder="Enter First Name">
                    <label class="form-label">Last Name</label>
                    <input class="form-control" type="text" id="lname" name="lname" placeholder="Enter First Name">
                </div>
                <div>
                    <label class="form-label">Choose an option</label>
                    <select class="form-select">
                        <option>---Select your course</option>
                        <option>Python Beginner Friendly Course</option>
                        <option>Web Design principles</option>
                    </select>
                    <label class="form-label">Email</label>
                    <input class="form-control" type="email" id="mail" name="mail" placeholder="Enter active email">
                </div>
                <div>
                    <label class="form-label">Mobile Number</label>
                    <input class="form-control" type="tel" id="mobile" name="mobile">
                </div>
                <button class="btn btn-primary" type="submit">Submit</button>
            </form>
        </div>
        <!-- student form -->
        <!--instructor form  -->

        <div id="InsForm">
            <h2>Register as a Instructor</h2>

            <form class="Form">

                <div>
                    <label class="form-label">First Name</label>
                    <input class="form-control" type="text" id="fname" name="fname" placeholder="Enter First Name">
                    <label class="form-label">Last Name</label>
                    <input class="form-control" type="text" id="lname" name="fname" placeholder="Enter First Name">`
                </div>
                <div>
                    <label class="form-label">Email</label>
                    <input class="form-control" type="email" id="mail" name="mail" placeholder="Enter active email">
                </div>
                <div>
                    <label class="form-label">Mobile Number</label>
                    <input class="form-control" type="tel" id="mobile" name="mobile">
                </div>
                <button class="btn btn-primary" type="submit">Submit</button>
            </form>
        </div>
        <!-- instructor form -->


    </main>

    <div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/signup.js"></script>

</body>

</html>
